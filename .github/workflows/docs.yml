# Antora build + deploy to GitHub Pages (Root Strategy).
# Copy into your docs repo. See docs/modules/publishing/pages/antora-deployment.adoc
#
# Required: Repo Settings → Pages → GitHub Actions (not branch deploy).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'antora-playbook.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'antora-playbook.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [extension-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # If playbook content.sources point at OTHER PRIVATE repos, GITHUB_TOKEN cannot clone them.
      # Use git_credentials or github_token on the action; see antora-deployment.adoc.
      - name: Build docs
        id: antora
        uses: antora-supplemental/antora-build-action@v3
        with:
          playbook: antora-playbook.yml
          output_dir: build/site
          install_dependencies: false
          setup_pnpm: false
          setup_node: false

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.antora.outputs.site-path }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
